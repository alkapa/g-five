name: 'Setup Android Build Environment'
description: 'Sets up JDK 17, Android SDK, NDK, CMake, and Gradle'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      shell: bash
      run: yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
